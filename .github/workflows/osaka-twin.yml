name: Osaka twin - collect live data and deploy

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: osaka-twin
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect official data
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: node scripts/fetch-osaka.mjs
      - name: Save data to the repository
        run: |
          git config user.name "osaka-twin-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No change"; else
            git commit -m "Data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main && git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
