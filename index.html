<style>

 --ai:#1B365D;--ai-d:#0F2240;--ai-050:#EEF2F8;--ai-100:#DCE4F0;--beni:#BC002D;--beni-050:#FCEEF1;--asagi:#00A3AF;--kin:#C9A227;
